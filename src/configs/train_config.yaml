# QAD on the nemotron-regen corpus — FULL config (8000 steps, ~4.5 epochs).
# save every 1000 steps (mid-run ckpts + final); eval every 200 steps.

teacher_model: Qwen/Qwen3.5-4B
student_init:  Qwen/Qwen3.5-4B
cyankiwi_path: cyankiwi/Qwen3.5-4B-AWQ-4bit   # HF id (or a local dir with the AWQ-4bit weights)
seed: 42

wandb_project:  edgefm-eqc-qad   # set null to disable wandb (stdout+JSONL only)
wandb_run_name: null

optimizer:    bnb.optim.AdamW8bit
lr:           2.0e-6
weight_decay: 0.0
betas:        [0.9, 0.95]
eps:          1.0e-8
grad_clip:    1.0

lr_schedule:  cosine
warmup_ratio: 0.03
epochs:       10
max_steps:    8000

max_seq_len:       16384
micro_batch_size:  1
grad_accum_steps:  16

kl_temperature: 1.0
mtp_alpha:      0.0
mixed_precision:    bf16
grad_checkpointing: true

calib_size: 8

eval_strategy:    steps
eval_steps:       200
save_strategy:    steps
save_steps:       1000
keep_last_ckpts:  0
log_every_steps:  10

inject_kl_tolerance: 0.005
